name: Relay safety gate

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay-ci-only
          POSTGRES_DB: relay_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d relay_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RELAY_TEST_POSTGRES_URL: postgresql+psycopg://relay:relay-ci-only@localhost:5432/relay_ci
      RELAY_POSTGRES_TEST_DESTRUCTIVE_OK: "true"
      RELAY_TEST_REDIS_URL: redis://localhost:6379/15
      RELAY_REDIS_TEST_DESTRUCTIVE_OK: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check for high-confidence secret patterns
        run: python scripts/check_secret_patterns.py
      - name: Validate source-only release scope
        run: python scripts/check_release_scope.py
      - name: Validate readiness evidence artifacts
        run: python scripts/check_readiness_artifacts.py
      - name: Parse deployment blueprints
        run: ruby -e 'require "yaml"; YAML.load_file("render.yaml"); YAML.load_file("render.staging.yaml"); puts "deployment blueprints parse"'
      - name: Install pinned application and audit dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q app migrations scripts tests
      - name: Run CSRF-enabled unit and route tests
        run: python -W error::DeprecationWarning -m unittest discover -v
      - name: Rehearse PostgreSQL forward and rollback migrations
        run: python -W error::DeprecationWarning -m unittest tests.postgres_migrations -v
      - name: Run PostgreSQL competing-action tests
        run: python -W error::DeprecationWarning -m unittest tests.postgres_concurrency -v
      - name: Verify shared Redis and trusted-proxy behavior
        run: python -W error::DeprecationWarning -m unittest tests.redis_proxy -v
      - name: Verify production-shaped boot and readiness
        run: python -W error::DeprecationWarning -m unittest tests.production_infrastructure -v
      - name: Scan the resolved runtime dependency graph
        run: python -m pip_audit --requirement requirements.txt --progress-spinner off
      - name: Check direct pins for published advisories
        run: python scripts/check_direct_advisories.py
